<!DOCTYPE html>
<html>
  <head>
    <title>MUD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <link href="stylesheet.css" rel="stylesheet">

  </head>

  <body>  
    <!-- Title and stuff -->
    <h1>MUD: Malicious URL Detector</h1>
    <h2>Throw a suspicious URL link into the MUD to check if it is malicious or not.</h2>
    <p>Please note that all detections are <b>not an official diagnosis</b>, predictions made by a trained random forest model. </p>
    
    <!-- User Input -->
    <input type="text" id="urlInput" placeholder="https://example.com">
    <button onclick="checkURL()">Check URL</button>
    
    <!-- Output -->
    <div class ="result" id="predictedURL"></div>
    
    <!-- link to js script (app.js)-->
    <script src="app.js"></script>

  </body>
</html>
